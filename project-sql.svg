<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420"><rect width="720" height="420" rx="28" fill="#101e2b"/><rect x="42" y="42" width="636" height="336" rx="16" fill="#172b3a" stroke="#355267"/><rect x="42" y="42" width="636" height="42" rx="16" fill="#223d50"/><circle cx="70" cy="63" r="6" fill="#e39a56"/><circle cx="91" cy="63" r="6" fill="#69a99c"/><circle cx="112" cy="63" r="6" fill="#7798b5"/><g font-family="monospace" font-size="22"><text x="82" y="140" fill="#85c9b9">CREATE TABLE</text><text x="255" y="140" fill="#f1d39a">Customers</text><text x="82" y="184" fill="#e6edf2">( CustomerID INT PRIMARY KEY,</text><text x="112" y="226" fill="#e6edf2">Name VARCHAR(100),</text><text x="112" y="268" fill="#e6edf2">OrderID INT,</text><text x="112" y="310" fill="#85c9b9">FOREIGN KEY (OrderID)</text><text x="112" y="348" fill="#85c9b9">REFERENCES Orders(OrderID) );</text></g></svg>